<div id="budget-page">
    <h2>Budget Management</h2>
    <div>
        <button id="add-category-btn">Add Category</button>
        <button id="add-item-btn">Add Item</button>
    </div>
    <table id="budget-table">
        <thead>
            <tr>
                <th>Category</th>
                <th>Item</th>
                <th>Budgeted Amount</th>
                <th>Actual Cost</th>
                <th>Difference</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows will be added here by JavaScript -->
            <tr>
                <td>Example Category</td>
                <td>Example Item</td>
                <td><input type="number" value="100" class="budgeted-amount"></td>
                <td><input type="number" value="90" class="actual-cost"></td>
                <td class="difference">10</td>
            </tr>
        </tbody>
    </table>
</div>
